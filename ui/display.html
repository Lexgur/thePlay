<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>thePlay display</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body class="h-screen overflow-hidden bg-black font-sans text-white">
  <video id="video" hidden muted class="fixed inset-0 h-full w-full bg-black object-contain"></video>
  <img id="picture" alt="" hidden class="fixed inset-0 h-full w-full bg-black object-contain">
  <div id="controls" class="pointer-events-none fixed inset-x-0 bottom-0 flex flex-wrap items-center gap-2 bg-black/75 px-4 py-3 text-sm opacity-0 transition-opacity">
    <span>Drag this window onto the projector.</span>
    <span id="screens" class="contents"></span>
    <button type="button" id="full" class="rounded-md bg-white px-3 py-1.5 text-sm font-medium text-stone-900 hover:bg-stone-200">Fullscreen</button>
  </div>
  <script src="/display.js"></script>
</body>
</html>
