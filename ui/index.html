<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>thePlay</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header>
    <strong>thePlay</strong>
    <button type="button" id="open">Open</button>
    <button type="button" id="show-display">Display</button>
    <span id="file-name"></span>
  </header>
  <p id="status" role="status"></p>
  <main>
    <article id="doc">
      <p class="empty">Open a .docx or .pdf. Select a sentence, attach a YouTube range, then press its key.</p>
    </article>
    <aside id="editor" hidden>
      <div id="sound-list" class="row"></div>
      <p id="quote"></p>
      <label>Key
        <span class="row">
          <button type="button" id="set-key">Set key</button>
          <strong id="key-label">none</strong>
        </span>
      </label>
      <p id="group-note" class="hint"></p>
      <label>YouTube URL
        <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=...">
      </label>
      <label>Start
        <input id="start" inputmode="numeric" placeholder="1:08" autocomplete="off">
      </label>
      <label>End
        <input id="end" inputmode="numeric" placeholder="1:43" autocomplete="off">
      </label>
      <label>Fade in (seconds)
        <input id="fade" type="number" min="0" max="120" step="0.1" value="2">
      </label>
      <label>Fade out (seconds)
        <input id="fade-out" type="number" min="0" max="120" step="0.1" value="2">
      </label>
      <label>Volume
        <input id="volume" type="number" min="0" max="100" step="1" value="100">
      </label>
      <label>Group picture
        <select id="visual-type">
          <option value="">Sound only</option>
          <option value="image">Image</option>
          <option value="video">YouTube video</option>
        </select>
      </label>
      <div id="visual-image" hidden>
        <button type="button" id="pick-image">Choose image</button>
        <span id="image-name"></span>
      </div>
      <div id="visual-video" hidden>
        <label>Video URL
          <input id="visual-url" type="url" placeholder="https://www.youtube.com/watch?v=...">
        </label>
        <label>From
          <input id="visual-start" inputmode="numeric" placeholder="optional" autocomplete="off">
        </label>
        <label>To
          <input id="visual-end" inputmode="numeric" placeholder="optional" autocomplete="off">
        </label>
        <p class="hint">Leave both empty to loop until the next group.</p>
      </div>
      <div class="row">
        <button type="button" id="save">Save</button>
        <button type="button" id="add" hidden>Add another</button>
        <button type="button" id="remove" hidden>Remove</button>
      </div>
    </aside>
  </main>
  <script src="/app.js"></script>
</body>
</html>
